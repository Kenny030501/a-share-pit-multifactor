[project]
name = "ashare-pit"
version = "0.2.0"
description = "Point-in-time A-share factor research, execution and evidence audit"
requires-python = ">=3.11,<3.14"
dependencies = [
  "akshare>=1.17",
  "cvxpy>=1.6",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "scipy>=1.13",
]

[project.scripts]
ashare-audit = "ashare_pit.quant_audit:main"
ashare-backtest = "ashare_pit.backtest:main"
ashare-data = "ashare_pit.data_source:main"
ashare-diagnostics = "ashare_pit.factor_diagnostics:main"
ashare-gtja-screen = "ashare_pit.gtja191_screening:main"
ashare-portfolio-check = "ashare_pit.portfolio_opt:main"
ashare-walkforward = "ashare_pit.walkforward:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/ashare_pit/gtja191.py" = ["E701", "E702", "E743"]
"src/ashare_pit/gtja191_screening.py" = ["E701"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ashare_pit"]
